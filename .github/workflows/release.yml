name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MODULE: NerdzValidation
  BUNDLE_ID: com.nerdzlab.NerdzValidation

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $version" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  docs:
    name: Build and deploy DocC
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Emit symbol graphs
        run: |
          swift build \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir -Xswiftc .build/symbol-graphs

      - name: Build documentation
        run: |
          "$(dirname "$(command -v swift)")/docc" convert \
            "Sources/$MODULE/Documentation.docc" \
            --fallback-display-name "$MODULE" \
            --fallback-bundle-identifier "$BUNDLE_ID" \
            --additional-symbol-graph-dir .build/symbol-graphs \
            --output-path _site \
            --transform-for-static-hosting \
            --hosting-base-path "${GITHUB_REPOSITORY#*/}" \
            2>&1 | tee docc.log
          if grep -qE "(^|[^/])(warning|error): " docc.log; then
            echo "DocC reported diagnostics" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
